<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Merger — The Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-card: #1a1a1a;
    --border: #2a2a2a;
    --border-hi: #3a3a3a;
    --text: #f0f0f0;
    --text-dim: #888;
    --text-mute: #555;
    --accent: #e8ff47;
    --accent-dim: #b8c93a;
    --danger: #ff5252;
    --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }
  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(232,255,71,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(232,255,71,0.03) 0%, transparent 40%);
    padding: 40px 24px 80px;
  }
  .container { max-width: 920px; margin: 0 auto; }
  .header { margin-bottom: 48px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
  .breadcrumb { font-size: 11px; color: var(--text-mute); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px; }
  .breadcrumb a { color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
  .breadcrumb a:hover { color: var(--accent); }
  h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(36px, 6vw, 56px); letter-spacing: -0.02em; line-height: 1; margin-bottom: 12px; }
  h1 .accent { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--text-dim); letter-spacing: 0.05em; }
  .dropzone { border: 2px dashed var(--border-hi); border-radius: 4px; padding: 56px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg-elev); margin-bottom: 24px; position: relative; overflow: hidden; }
  .dropzone::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 0%, rgba(232,255,71,0.03) 50%, transparent 100%); opacity: 0; transition: opacity 0.3s; }
  .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: var(--bg-card); }
  .dropzone:hover::before, .dropzone.dragover::before { opacity: 1; }
  .dropzone-icon { font-family: 'Syne', sans-serif; font-size: 48px; font-weight: 800; color: var(--accent); margin-bottom: 16px; letter-spacing: -0.04em; }
  .dropzone-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  .dropzone-hint { font-size: 12px; color: var(--text-mute); letter-spacing: 0.05em; }
  #fileInput { display: none; }
  .file-list-header { display: flex; justify-content: space-between; align-items: baseline; margin: 32px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .file-list-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  .file-list-count { font-size: 11px; color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase; }
  .file-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .file-item { display: grid; grid-template-columns: 28px 56px 1fr auto auto auto; align-items: center; gap: 14px; padding: 12px 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px; transition: all 0.15s; cursor: grab; }
  .file-item:hover { border-color: var(--border-hi); background: var(--bg-card); }
  .file-item.dragging { opacity: 0.4; cursor: grabbing; }
  .file-item.drop-target { border-color: var(--accent); }
  .file-index { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--accent); font-size: 14px; }
  .file-thumb { width: 56px; height: 72px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .file-thumb canvas { max-width: 100%; max-height: 100%; display: block; }
  .file-thumb .thumb-loading { font-size: 9px; color: var(--text-mute); letter-spacing: 0.05em; }
  .file-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 11px; color: var(--text-mute); letter-spacing: 0.05em; }
  .file-actions { display: flex; gap: 4px; }
  .icon-btn { width: 28px; height: 28px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; border-radius: 3px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .icon-btn:disabled:hover { border-color: var(--border); color: var(--text-dim); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .empty-state { text-align: center; padding: 32px; color: var(--text-mute); font-size: 12px; letter-spacing: 0.05em; }
  .action-bar { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.05em; padding: 14px 24px; border: 1px solid var(--border-hi); background: transparent; color: var(--text); cursor: pointer; border-radius: 3px; transition: all 0.15s; text-transform: uppercase; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--bg); }
  .btn.primary:disabled { background: var(--border); border-color: var(--border); color: var(--text-mute); }
  .status { margin-left: auto; font-size: 11px; color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase; }
  .status.working { color: var(--accent); }
  .status.success { color: var(--success); }
  .status.error { color: var(--danger); }
  .progress { height: 2px; background: var(--border); margin-top: 16px; overflow: hidden; display: none; }
  .progress.active { display: block; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: none; align-items: stretch; justify-content: center; padding: 24px; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg-elev); border: 1px solid var(--border-hi); border-radius: 4px; width: 100%; max-width: 980px; display: flex; flex-direction: column; overflow: hidden; animation: modalIn 0.2s ease-out; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .modal-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.02em; }
  .modal-title .accent { color: var(--accent); }
  .modal-meta { font-size: 11px; color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 16px; }
  .modal-close { width: 32px; height: 32px; border: 1px solid var(--border-hi); background: transparent; color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 16px; cursor: pointer; border-radius: 3px; transition: all 0.15s; }
  .modal-close:hover { border-color: var(--danger); color: var(--danger); }
  .modal-body { overflow-y: auto; flex: 1; padding: 24px; background: repeating-linear-gradient(45deg, transparent 0, transparent 12px, rgba(255,255,255,0.01) 12px, rgba(255,255,255,0.01) 13px), var(--bg); }
  .modal-loading { text-align: center; padding: 80px 24px; color: var(--text-dim); font-size: 13px; letter-spacing: 0.1em; }
  .modal-loading .accent { color: var(--accent); }
  .preview-section { margin-bottom: 32px; }
  .preview-section:last-child { margin-bottom: 0; }
  .preview-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 14px; background: var(--bg-card); border-left: 3px solid var(--accent); border-radius: 2px; }
  .preview-divider-idx { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--accent); font-size: 14px; letter-spacing: 0.02em; }
  .preview-divider-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .preview-divider-pages { font-size: 10px; color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase; }
  .preview-pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .preview-page { background: white; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; position: relative; aspect-ratio: 1 / 1.414; display: flex; align-items: center; justify-content: center; }
  .preview-page canvas { max-width: 100%; max-height: 100%; display: block; }
  .preview-page-number { position: absolute; bottom: 4px; right: 6px; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text); background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 2px; letter-spacing: 0.05em; }
  .preview-page-loading { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-mute); letter-spacing: 0.05em; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; background: var(--bg); }
  .footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text-mute); letter-spacing: 0.15em; text-transform: uppercase; text-align: center; }
  @media (max-width: 600px) {
    .file-item { grid-template-columns: 24px 44px 1fr auto; gap: 10px; padding: 10px; }
    .file-thumb { width: 44px; height: 58px; }
    .file-meta { display: none; }
    .file-item .file-actions:first-of-type { display: none; }
    .action-bar { flex-direction: column; align-items: stretch; }
    .status { margin-left: 0; text-align: center; }
    .modal-overlay { padding: 0; }
    .modal { border-radius: 0; max-height: 100vh; }
    .preview-pages { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="breadcrumb"><a href="./">The Portal</a> / Tools / PDF Merger</div>
    <h1>PDF <span class="accent">Merger</span></h1>
    <p class="subtitle">// 複数のPDFを1つのファイルに結合 — プレビュー付き</p>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">+</div>
    <div class="dropzone-text">PDFをドロップまたはクリックして選択</div>
    <div class="dropzone-hint">複数ファイル選択可 / .pdf only</div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple>
  </div>

  <div class="file-list-header">
    <div class="file-list-title">FILES</div>
    <div class="file-list-count" id="fileCount">0 files</div>
  </div>

  <ul class="file-list" id="fileList">
    <li class="empty-state">// no files added yet</li>
  </ul>

  <div class="action-bar">
    <button class="btn primary" id="mergeBtn" disabled>MERGE &amp; DOWNLOAD</button>
    <button class="btn" id="previewBtn" disabled>PREVIEW</button>
    <button class="btn" id="clearBtn" disabled>CLEAR ALL</button>
    <div class="status" id="status">READY</div>
  </div>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

  <footer class="footer">meru55 / the-portal — pdf merger v1.1</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div style="display:flex; align-items:baseline; min-width:0; flex:1;">
        <div class="modal-title">PREVIEW <span class="accent">// MERGED OUTPUT</span></div>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <button class="modal-close" id="modalClose" title="閉じる (Esc)">×</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-loading">// <span class="accent">RENDERING</span> PREVIEW...</div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modalCancelBtn">CLOSE</button>
      <button class="btn primary" id="modalDownloadBtn">DOWNLOAD</button>
    </div>
  </div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

const { PDFDocument } = PDFLib;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const fileCount = document.getElementById('fileCount');
const mergeBtn = document.getElementById('mergeBtn');
const previewBtn = document.getElementById('previewBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const progress = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');

const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalCancelBtn = document.getElementById('modalCancelBtn');
const modalDownloadBtn = document.getElementById('modalDownloadBtn');
const modalBody = document.getElementById('modalBody');
const modalMeta = document.getElementById('modalMeta');

let files = [];

const formatSize = (b) => {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
};

const setStatus = (text, cls='') => {
  statusEl.textContent = text;
  statusEl.className = 'status ' + cls;
};

const updateCount = () => {
  fileCount.textContent = `${files.length} file${files.length === 1 ? '' : 's'}`;
  mergeBtn.disabled = files.length < 1;
  previewBtn.disabled = files.length < 1;
  clearBtn.disabled = files.length === 0;
};

const renderThumb = async (file, container) => {
  try {
    if (!file.pdfjsDoc) {
      file.pdfjsDoc = await pdfjsLib.getDocument({ data: file.buffer.slice(0) }).promise;
    }
    const page = await file.pdfjsDoc.getPage(1);
    const viewport = page.getViewport({ scale: 1 });
    const targetH = 72;
    const scale = targetH / viewport.height;
    const scaled = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = scaled.width * dpr;
    canvas.height = scaled.height * dpr;
    canvas.style.width = scaled.width + 'px';
    canvas.style.height = scaled.height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    await page.render({ canvasContext: ctx, viewport: scaled }).promise;
    container.innerHTML = '';
    container.appendChild(canvas);
  } catch(err) {
    console.warn('thumb render failed:', file.name, err);
    container.innerHTML = '<div class="thumb-loading">N/A</div>';
  }
};

const render = () => {
  if (files.length === 0) {
    fileList.innerHTML = '<li class="empty-state">// no files added yet</li>';
    updateCount();
    return;
  }
  fileList.innerHTML = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.className = 'file-item';
    li.draggable = true;
    li.dataset.id = f.id;
    li.innerHTML = `
      <div class="file-index">${String(i+1).padStart(2,'0')}</div>
      <div class="file-thumb"><div class="thumb-loading">...</div></div>
      <div class="file-name" title="${f.name}">${f.name}</div>
      <div class="file-meta">${f.pages ? f.pages + 'p' : '...'} · ${formatSize(f.size)}</div>
      <div class="file-actions">
        <button class="icon-btn" data-act="up" ${i===0?'disabled':''} title="上へ">↑</button>
        <button class="icon-btn" data-act="down" ${i===files.length-1?'disabled':''} title="下へ">↓</button>
      </div>
      <div class="file-actions">
        <button class="icon-btn danger" data-act="remove" title="削除">×</button>
      </div>
    `;
    li.addEventListener('dragstart', (e) => {
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', f.id);
    });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('drop-target'); });
    li.addEventListener('dragleave', () => li.classList.remove('drop-target'));
    li.addEventListener('drop', (e) => {
      e.preventDefault(); e.stopPropagation();
      li.classList.remove('drop-target');
      const draggedId = e.dataTransfer.getData('text/plain');
      if (!draggedId || draggedId === f.id) return;
      const fromIdx = files.findIndex(x => x.id === draggedId);
      const toIdx = files.findIndex(x => x.id === f.id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = files.splice(fromIdx, 1);
      files.splice(toIdx, 0, moved);
      render();
    });
    li.querySelectorAll('.icon-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        const idx = files.findIndex(x => x.id === f.id);
        if (act === 'up' && idx > 0) { [files[idx-1], files[idx]] = [files[idx], files[idx-1]]; }
        else if (act === 'down' && idx < files.length-1) { [files[idx+1], files[idx]] = [files[idx], files[idx+1]]; }
        else if (act === 'remove') { files.splice(idx, 1); }
        render();
      });
    });
    fileList.appendChild(li);
    const thumbBox = li.querySelector('.file-thumb');
    renderThumb(f, thumbBox);
  });
  updateCount();
};

const addFiles = async (fileObjs) => {
  const pdfs = Array.from(fileObjs).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  if (pdfs.length === 0) { setStatus('NO PDF SELECTED', 'error'); return; }
  setStatus('LOADING...', 'working');
  for (const file of pdfs) {
    const id = crypto.randomUUID();
    const buffer = await file.arrayBuffer();
    const entry = { id, file, name: file.name, size: file.size, pages: null, buffer, pdfjsDoc: null };
    files.push(entry);
    try {
      const doc = await PDFDocument.load(buffer.slice(0), { ignoreEncryption: true });
      entry.pages = doc.getPageCount();
    } catch(err) {
      entry.pages = '?';
      console.warn('page count failed:', file.name, err);
    }
  }
  render();
  setStatus(`${pdfs.length} FILES ADDED`, 'success');
  setTimeout(() => setStatus('READY'), 1500);
};

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });
['dragenter','dragover'].forEach(ev => {
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
});
['dragleave','drop'].forEach(ev => {
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === 'dragleave' && e.target !== dropzone) return;
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

clearBtn.addEventListener('click', () => {
  if (files.length === 0) return;
  if (confirm('全てのファイルを削除しますか？')) {
    files = [];
    render();
    setStatus('CLEARED');
    setTimeout(() => setStatus('READY'), 1000);
  }
});

const performMerge = async () => {
  const mergedPdf = await PDFDocument.create();
  for (let i = 0; i < files.length; i++) {
    const src = await PDFDocument.load(files[i].buffer.slice(0), { ignoreEncryption: true });
    const pages = await mergedPdf.copyPages(src, src.getPageIndices());
    pages.forEach(p => mergedPdf.addPage(p));
    progressBar.style.width = ((i+1)/files.length*100) + '%';
  }
  return await mergedPdf.save();
};

const downloadMerged = async () => {
  if (files.length === 0) return;
  mergeBtn.disabled = true; previewBtn.disabled = true; clearBtn.disabled = true;
  progress.classList.add('active');
  progressBar.style.width = '0%';
  setStatus('MERGING...', 'working');
  try {
    const bytes = await performMerge();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
    a.href = url;
    a.download = `merged_${ts}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('DONE — DOWNLOADED', 'success');
  } catch(err) {
    console.error(err);
    setStatus('ERROR: ' + (err.message || 'unknown'), 'error');
    alert('結合中にエラーが発生しました:\n' + (err.message || err));
  } finally {
    setTimeout(() => {
      progress.classList.remove('active');
      progressBar.style.width = '0%';
      setStatus('READY');
    }, 2000);
    updateCount();
  }
};
mergeBtn.addEventListener('click', downloadMerged);

const openModal = () => { modalOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
const closeModal = () => { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; };
modalClose.addEventListener('click', closeModal);
modalCancelBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });
modalDownloadBtn.addEventListener('click', async () => { closeModal(); await downloadMerged(); });

const renderPreviewPage = async (pdfjsDoc, pageNum, container, globalNum) => {
  try {
    const page = await pdfjsDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });
    const targetW = 220;
    const scale = targetW / viewport.width;
    const scaled = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = scaled.width * dpr;
    canvas.height = scaled.height * dpr;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    await page.render({ canvasContext: ctx, viewport: scaled }).promise;
    container.innerHTML = '';
    container.appendChild(canvas);
    const num = document.createElement('div');
    num.className = 'preview-page-number';
    num.textContent = `p.${globalNum}`;
    container.appendChild(num);
  } catch(err) {
    console.warn('preview page failed:', err);
    container.innerHTML = '<div class="preview-page-loading">RENDER FAILED</div>';
  }
};

const buildPreview = async () => {
  modalBody.innerHTML = '<div class="modal-loading">// <span class="accent">RENDERING</span> PREVIEW...</div>';
  openModal();

  let totalPages = 0;
  files.forEach(f => { if (typeof f.pages === 'number') totalPages += f.pages; });
  modalMeta.textContent = `${files.length} files · ${totalPages} pages`;

  for (const f of files) {
    if (!f.pdfjsDoc) {
      try { f.pdfjsDoc = await pdfjsLib.getDocument({ data: f.buffer.slice(0) }).promise; }
      catch(err) { console.warn('pdfjs load failed:', f.name, err); }
    }
  }

  modalBody.innerHTML = '';
  let globalNum = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const section = document.createElement('div');
    section.className = 'preview-section';
    const divider = document.createElement('div');
    divider.className = 'preview-divider';
    divider.innerHTML = `
      <div class="preview-divider-idx">${String(i+1).padStart(2,'0')}</div>
      <div class="preview-divider-name">${f.name}</div>
      <div class="preview-divider-pages">${f.pages || '?'} PAGES</div>
    `;
    section.appendChild(divider);

    const grid = document.createElement('div');
    grid.className = 'preview-pages';
    section.appendChild(grid);
    modalBody.appendChild(section);

    if (!f.pdfjsDoc) {
      grid.innerHTML = '<div class="preview-page-loading" style="grid-column:1/-1;text-align:center;padding:24px;">// 読み込み失敗</div>';
      continue;
    }

    const pageCount = f.pdfjsDoc.numPages;
    const placeholders = [];
    for (let p = 1; p <= pageCount; p++) {
      globalNum++;
      const cell = document.createElement('div');
      cell.className = 'preview-page';
      cell.innerHTML = '<div class="preview-page-loading">...</div>';
      grid.appendChild(cell);
      placeholders.push({ cell, p, g: globalNum });
    }
    for (const { cell, p, g } of placeholders) {
      await renderPreviewPage(f.pdfjsDoc, p, cell, g);
    }
  }
};
previewBtn.addEventListener('click', buildPreview);

updateCount();
</script>
</body>
</html>
