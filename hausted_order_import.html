<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ハウステック工程表ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
:root{--bg:#0c0c0f;--surface:#141418;--surface2:#1c1c22;--border:#2a2a35;--accent:#e8ff47;--accent2:#47ffe8;--text:#f0f0f5;--muted:#6b6b80;--danger:#ff4757;--success:#4ade80;--mon:#5b9bd5;--monthchg:#70ad47;--radius:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 20px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 600px 400px at 80% 10%,rgba(232,255,71,0.04) 0%,transparent 70%),radial-gradient(ellipse 400px 600px at 10% 80%,rgba(71,255,232,0.03) 0%,transparent 70%);pointer-events:none;z-index:0;}
.container{max-width:1400px;margin:0 auto;position:relative;z-index:1;}
header{margin-bottom:24px;animation:fadeUp 0.6s ease both;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.9rem;letter-spacing:-0.02em;line-height:1;margin-bottom:6px;}
.logo span{color:var(--accent);}
.subtitle{color:var(--muted);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;}

/* タブ */
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1.5px solid var(--border);padding-bottom:0;animation:fadeUp 0.55s ease both;}
.tab{padding:11px 22px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.82rem;letter-spacing:0.06em;cursor:pointer;border:1.5px solid transparent;border-bottom:none;border-radius:9px 9px 0 0;color:var(--muted);background:transparent;transition:all 0.2s;margin-bottom:-1.5px;text-transform:uppercase;}
.tab:hover{color:var(--text);background:rgba(232,255,71,0.04);}
.tab.active{color:var(--bg);background:var(--accent);border-color:var(--accent);}
.tab.active:hover{background:#f0ff70;}
.tab-icon{display:inline-block;margin-right:6px;font-size:0.9em;}
.view{display:none;animation:fadeUp 0.5s ease both;}
.view.active{display:block;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;animation:fadeUp 0.5s ease both;}
.section-label{font-family:'Syne',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.drop-zone{border:1.5px dashed var(--border);border-radius:8px;padding:36px 20px;text-align:center;cursor:pointer;transition:all 0.25s;}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(232,255,71,0.03);}
.drop-zone.loaded{border-color:var(--success);border-style:solid;}
.drop-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:6px;}
.drop-hint{color:var(--muted);font-size:0.72rem;}
.drop-hint strong{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.status-row{display:flex;gap:10px;flex-wrap:wrap;}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:0.72rem;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
.status-pill.ok .dot{background:var(--success);box-shadow:0 0 8px var(--success);}
.status-pill.warn .dot{background:var(--danger);box-shadow:0 0 8px var(--danger);}
.status-pill.loading .dot{background:var(--accent2);animation:pulse 1s infinite;}
.status-pill.ok{border-color:rgba(74,222,128,0.3);color:var(--success);}
.status-pill.warn{border-color:rgba(255,71,87,0.3);color:#ff8597;}
.status-pill.loading{border-color:rgba(71,255,232,0.3);color:var(--accent2);}
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center;min-width:80px;}
.stat-num{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--text);}
.stat-num.ok{color:var(--success);}.stat-num.warn{color:var(--danger);}
.stat-label{font-size:0.62rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.06em;}

/* 受注テーブル */
.table-wrap{overflow-x:auto;}
table.orders{width:100%;border-collapse:collapse;font-size:11px;}
table.orders th{background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:7px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
table.orders td{padding:5px 8px;border-bottom:1px solid rgba(42,42,53,0.6);color:var(--text);white-space:nowrap;vertical-align:middle;}
table.orders tr:hover td{background:var(--surface2);}
table.orders tr.warn-row td{background:rgba(255,71,87,0.04);}
table.orders tr.date-sep td{background:linear-gradient(90deg,rgba(232,255,71,0.06),transparent);font-family:'Syne',sans-serif;font-weight:700;font-size:0.7rem;color:var(--accent);letter-spacing:0.08em;padding:8px 8px 6px;border-bottom:1px solid rgba(232,255,71,0.2);border-top:1px solid rgba(232,255,71,0.15);}
table.orders tr.group-sep td{padding:0;border-bottom:1px dashed rgba(71,255,232,0.15);}
.group-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.65rem;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:0.04em;background:rgba(71,255,232,0.08);color:var(--accent2);border:1px solid rgba(71,255,232,0.25);}
.group-badge.solo{background:transparent;color:var(--muted);border-color:var(--border);font-weight:400;font-style:italic;}
table.orders td input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:3px 6px;width:100%;outline:none;transition:border-color 0.2s;}
table.orders td input:focus{border-color:var(--accent2);}
table.orders td input.unfilled{border-color:var(--danger);background:rgba(255,71,87,0.08);}
table.orders td input.filled{border-color:var(--success);}

/* カレンダーテーブル */
.cal-wrap{overflow-x:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px;}
table.calendar{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;}
table.calendar th,table.calendar td{padding:5px 6px;border-right:1px solid rgba(42,42,53,0.6);border-bottom:1px solid rgba(42,42,53,0.6);white-space:nowrap;}
table.calendar thead th{position:sticky;top:0;background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-align:center;z-index:3;}
table.calendar thead tr:nth-child(2) th{top:26px;}
table.calendar thead th.monthchg{background:var(--monthchg);color:#fff;}
table.calendar thead th.monday{background:var(--mon);color:#fff;}
table.calendar thead th.total-h{background:#7a1f1f;color:#fff;}
table.calendar tbody td{text-align:right;color:var(--text);}
table.calendar tbody td.label{text-align:left;color:var(--text);}
table.calendar tbody td.code{text-align:center;color:var(--accent2);font-size:10px;}
table.calendar tbody td.zero{color:var(--muted);opacity:0.3;}
table.calendar tbody td.qty{font-weight:600;color:var(--accent);}
table.calendar tbody td.mon-col{background:rgba(91,155,213,0.06);}
table.calendar tbody td.total{background:rgba(255,242,204,0.08);color:var(--accent);font-weight:700;border-left:1.5px solid var(--border);}
table.calendar tbody tr:hover td{background:var(--surface2);}
table.calendar tbody tr:hover td.mon-col{background:rgba(91,155,213,0.12);}
table.calendar tbody tr:hover td.total{background:rgba(255,242,204,0.15);}
table.calendar tfoot td{background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);text-align:right;border-top:2px solid var(--accent);font-size:11px;padding:7px 6px;position:sticky;bottom:0;z-index:2;}
table.calendar tfoot td.label{text-align:left;}
table.calendar thead th.sticky-col,table.calendar tbody td.sticky-col,table.calendar tfoot td.sticky-col{position:sticky;background:var(--surface);z-index:2;}
table.calendar thead th.sticky-col{background:var(--surface2);z-index:4;}
table.calendar tfoot td.sticky-col{background:var(--surface2);z-index:3;}
table.calendar .col-pn{left:0;min-width:80px;}
table.calendar .col-sz{left:80px;min-width:100px;}
table.calendar .col-nm{left:180px;min-width:200px;border-right:1.5px solid var(--border);}

.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:7px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.78rem;letter-spacing:0.05em;cursor:pointer;transition:all 0.2s;border:1.5px solid var(--border);background:transparent;color:var(--muted);}
.btn:hover{border-color:#3a3a4a;color:var(--text);}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.btn-primary:hover:not(:disabled){background:#f0ff70;border-color:#f0ff70;transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,255,71,0.2);}
.btn-secondary{border-color:rgba(71,255,232,0.25);color:var(--accent2);background:rgba(71,255,232,0.05);}
.btn-secondary:hover:not(:disabled){background:rgba(71,255,232,0.12);border-color:var(--accent2);transform:translateY(-1px);}
.msg{font-size:0.7rem;color:var(--muted);}.msg.ok{color:var(--success);}.msg.err{color:var(--danger);}
.badge{display:inline-block;font-size:0.6rem;padding:2px 7px;border-radius:4px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-left:8px;}
.badge-warn{background:rgba(255,71,87,0.15);color:var(--danger);border:1px solid rgba(255,71,87,0.3);}
.badge-ok{background:rgba(74,222,128,0.12);color:var(--success);border:1px solid rgba(74,222,128,0.25);}
.alert{padding:10px 14px;border-radius:7px;font-size:0.72rem;margin-top:10px;display:none;line-height:1.5;}
.alert.visible{display:block;}
.alert-warn{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);color:#ff8597;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#3a3a4a;}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="logo">工程表ツール<span>ハウステック</span></div>
  <div class="subtitle">月次工程表 → カレンダー / 受注CSV 変換ツール</div>
</header>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" data-view="cal"><span class="tab-icon">▦</span>出荷カレンダー作成</div>
  <div class="tab" data-view="ord"><span class="tab-icon">↓</span>受注データ取込</div>
</div>

<!-- 共通: マスタ参照状況 -->
<div class="card" style="animation-delay:0.05s">
  <div class="section-label">マスター参照状況</div>
  <div class="status-row">
    <div class="status-pill loading" id="pillParts"><div class="dot"></div><span id="textParts">品名対応表 読込中...</span></div>
    <div class="status-pill loading" id="pillGroups"><div class="dot"></div><span id="textGroups">グループ定義 読込中...</span></div>
    <div class="status-pill" id="pillCal"><div class="dot"></div><span id="textCal">カレンダー (工程表アップ後)</span></div>
  </div>
  <div class="alert alert-warn" id="alertBox"></div>
</div>

<!-- 共通: 月次工程表 -->
<div class="card" style="animation-delay:0.1s">
  <div class="section-label">月次工程表</div>
  <div class="drop-zone" id="schZone">
    <div class="drop-title" id="schTitle">工程表をここにドロップ</div>
    <div class="drop-hint">または <strong id="browseBtn">ファイルを選択</strong> &nbsp;<span style="opacity:0.6">(.xls / .xlsx)</span></div>
    <input type="file" id="schFile" accept=".xlsx,.xls" style="display:none" onchange="loadSchedule(this)">
  </div>
</div>

<!-- ===== ビュー1: 出荷カレンダー作成 ===== -->
<div class="view active" id="view-cal">
  <div class="card" id="calCard" style="display:none;animation-delay:0.15s">
    <div class="section-label">出荷カレンダー <span id="calHeaderBadge"></span></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="sItems">0</div><div class="stat-label">品目数</div></div>
      <div class="stat"><div class="stat-num" id="sDays">0</div><div class="stat-label">出荷日数</div></div>
      <div class="stat"><div class="stat-num" id="sRecords">0</div><div class="stat-label">明細数</div></div>
      <div class="stat"><div class="stat-num ok" id="sQty">0</div><div class="stat-label">総数量</div></div>
      <div class="stat"><div class="stat-num warn" id="sMissPn">0</div><div class="stat-label">品番未照合</div></div>
    </div>
    <div class="cal-wrap">
      <table class="calendar" id="calTable"></table>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="dlExcelBtn" onclick="downloadExcel()" disabled>↓ Excel ダウンロード</button>
      <span class="msg" id="dlExcelMsg"></span>
    </div>
  </div>
</div>

<!-- ===== ビュー2: 受注データ取込 ===== -->
<div class="view" id="view-ord">
  <div class="card" id="ordCard" style="display:none;animation-delay:0.15s">
    <div class="section-label">受注データ <span id="ordHeaderBadge"></span></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="oTotal">0</div><div class="stat-label">合計件数</div></div>
      <div class="stat"><div class="stat-num ok" id="oMatched">0</div><div class="stat-label">品番照合</div></div>
      <div class="stat"><div class="stat-num ok" id="oFilled">0</div><div class="stat-label">日付入力</div></div>
      <div class="stat"><div class="stat-num warn" id="oUnfilled">0</div><div class="stat-label">未完成</div></div>
      <div class="stat"><div class="stat-num" id="oFiles">0</div><div class="stat-label">生成ファイル</div></div>
    </div>
    <div class="table-wrap">
      <table class="orders">
        <thead>
          <tr>
            <th style="width:22px">#</th>
            <th style="width:78px">受注日</th>
            <th style="width:78px">納入日</th>
            <th style="width:110px">グループ</th>
            <th style="width:90px">資材コード</th>
            <th style="width:130px">社内品番</th>
            <th style="width:50px">数量</th>
            <th style="width:100px">客先発注番号</th>
            <th style="width:90px">納期</th>
            <th style="width:90px">出荷予定日</th>
          </tr>
        </thead>
        <tbody id="ordTbody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="dlBtn" onclick="downloadCSV()" disabled>↓ CSV ダウンロード</button>
      <button class="btn btn-secondary" id="zipBtn" onclick="downloadGroupedZip()" disabled>↓ グループ別CSV(ZIP)</button>
      <span class="msg" id="dlMsg"></span>
    </div>
  </div>
</div>

</div>
<script>
// ===== 共通定数・状態 =====
const TOKUISAKI = '000440';
const NYUSAKI   = '004440';
const PARTS_URL = './hinmei_master.xlsx';
const GROUPS_URL = './groups.xlsx';
const CAL_BASE  = './';

// partsMap は統合形式: 資材コード -> {pn:品番, nm:品名}
let partsMap = {};
let groupsMap = {};      // 資材コード -> グループ名
let calendar = {};       // YYYYMMDD(納期) -> {noki, shukka}
let parsedRows = [];     // {shizai, hinmeiKt, chuban, bunban, chaku, qty, jban, noki, shukka, pn, nm}
let currentYear = null;
let currentMonth = null;

function pad2(n){return String(n).padStart(2,'0');}

function fmt8(d){
  if(!d) return '';
  if(d instanceof Date){
    return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
  }
  if(typeof d==='string'){
    const s=d.trim();
    let m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}${pad2(m[2])}${pad2(m[3])}`;
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){
      let y=parseInt(m[3]);
      if(y<100) y+=2000;
      return `${y}${pad2(m[1])}${pad2(m[2])}`;
    }
    if(/^\d{8}$/.test(s)) return s;
    if(/^\d+(\.\d+)?$/.test(s)){
      const n=parseFloat(s);
      if(n>20000&&n<80000){
        const epoch=new Date(Date.UTC(1899,11,30));
        const dt=new Date(epoch.getTime()+n*86400000);
        return fmt8(dt);
      }
    }
    const dt=new Date(s);
    if(!isNaN(dt.getTime())) return fmt8(dt);
  }
  if(typeof d==='number'){
    const epoch=new Date(Date.UTC(1899,11,30));
    const dt=new Date(epoch.getTime()+d*86400000);
    return fmt8(dt);
  }
  return '';
}

function todayYMD(){return fmt8(new Date());}

function ymdToDate(ymd){
  if(!ymd||ymd.length!==8) return null;
  return new Date(parseInt(ymd.substr(0,4)),parseInt(ymd.substr(4,2))-1,parseInt(ymd.substr(6,2)));
}

const WD=['日','月','火','水','木','金','土'];

function setPill(id, state, text){
  const el=document.getElementById(id);
  el.className=`status-pill ${state}`;
  document.getElementById(id.replace('pill','text')).textContent=text;
}

function showWarn(msg){
  const el=document.getElementById('alertBox');
  el.innerHTML=msg;
  el.classList.add('visible');
}
function clearWarn(){
  document.getElementById('alertBox').classList.remove('visible');
}

// ===== マスタ読込 =====
async function loadPartsMaster(){
  setPill('pillParts','loading','品名対応表 読込中...');
  try{
    const res=await fetch(PARTS_URL+'?t='+Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    partsMap={};
    let count=0;
    for(let i=1;i<rows.length;i++){
      const sz=String(rows[i][0]||'').trim();
      const pn=String(rows[i][1]||'').trim();
      const nm=String(rows[i][2]||'').trim();
      if(sz){partsMap[sz]={pn,nm};count++;}
    }
    setPill('pillParts','ok',`品名対応表 ${count}件`);
  }catch(err){
    setPill('pillParts','warn','品名対応表 未取得');
    showWarn(`<strong>hinmei_master.xlsx</strong> が読み込めませんでした。社内品番は手動入力が必要です。`);
  }
}

async function loadGroupsMaster(){
  setPill('pillGroups','loading','グループ定義 読込中...');
  try{
    const res=await fetch(GROUPS_URL+'?t='+Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    groupsMap={};
    let count=0;
    for(let i=1;i<rows.length;i++){
      const groupName=String(rows[i][0]||'').trim();
      const shizai=String(rows[i][1]||'').trim();
      if(shizai){
        groupsMap[shizai]=groupName;
        count++;
      }
    }
    setPill('pillGroups','ok',`グループ定義 ${count}件`);
  }catch(err){
    setPill('pillGroups','warn','グループ定義 未取得');
    showWarn(`<strong>groups.xlsx</strong> が読み込めませんでした。グループ別CSV出力は使えません。`);
  }
}

async function loadCalendar(year, month){
  const fname=`haustec_${year}${pad2(month)}.xlsx`;
  setPill('pillCal','loading',`${fname} 読込中...`);
  try{
    const res=await fetch(CAL_BASE+encodeURIComponent(fname)+'?t='+Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    calendar={};
    let count=0;
    for(let i=1;i<rows.length;i++){
      const r=rows[i]||[];
      if(!r[0]) continue;
      const key=fmt8(r[0]);
      const noki=fmt8(r[1]);
      const shukka=fmt8(r[2]);
      if(key){
        calendar[key]={noki,shukka};
        count++;
      }
    }
    setPill('pillCal','ok',`${fname} (${count}日)`);
    clearWarn();
  }catch(err){
    calendar={};
    setPill('pillCal','warn',`${fname} 未取得`);
    showWarn(`カレンダー <strong>${fname}</strong> が見つかりません。納期・出荷予定日は手動入力してください。`);
  }
}

// ===== 工程表読込 =====
function loadSchedule(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      
      let year=new Date().getFullYear(), month=new Date().getMonth()+1;
      const info=parseHeaderMonth(data);
      if(info){year=info.year;month=info.month;}
      currentYear=year;
      currentMonth=month;
      
      await loadCalendar(year,month);
      
      parsedRows=extractFromSchedule(data,year,month);
      if(parsedRows.length===0) throw new Error('明細を検出できませんでした');
      
      // 全行に対してマスタ照合・カレンダー照合
      parsedRows.forEach(r=>{
        const cal=calendar[r.chaku]||{};
        r.noki=cal.noki||'';
        r.shukka=cal.shukka||'';
        const m=partsMap[r.shizai];
        r.pn=m?m.pn:'';
        r.nm=m?(m.nm||''):'';
      });
      
      const z=document.getElementById('schZone');
      z.classList.add('loaded');
      document.getElementById('schTitle').innerHTML=`<span style="color:var(--success)">✓ ${file.name} (${parsedRows.length}件)</span>`;
      
      // 両方のビューを描画
      document.getElementById('calCard').style.display='block';
      document.getElementById('ordCard').style.display='block';
      renderCalendar();
      renderOrderTable();
    }catch(err){
      document.getElementById('schTitle').innerHTML=`<span style="color:var(--danger)">✗ ${err.message}</span>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseHeaderMonth(data){
  let month=null,year=null;
  for(let i=0;i<Math.min(15,data.length);i++){
    const row=data[i]||[];
    for(const cell of row){
      if(typeof cell==='string'){
        if(month===null){
          const m=cell.match(/(\d+)月分/);
          if(m) month=parseInt(m[1]);
        }
        if(year===null){
          const ym=cell.match(/(\d{4})年/);
          if(ym) year=parseInt(ym[1]);
        }
      }
    }
  }
  if(month===null) return null;
  if(year===null) year=new Date().getFullYear();
  return {year,month};
}

function extractFromSchedule(data,year,month){
  const rows=[];
  const shizaiPattern=/^[0-9][A-Z0-9]{7}$|^[0-9][A-Z]\d{8}$/;
  const datePattern=/^(0?[1-9]|[12]\d|3[01])$/;
  let currentDateMap=null;
  
  for(let i=0;i<data.length;i++){
    const row=data[i]||[];
    const c0=row[0]!=null?String(row[0]).trim():'';
    const c1=row[1]!=null?String(row[1]).trim():'';
    if(c0==='№'||c1==='品名'){
      const dc={};
      for(let j=0;j<row.length;j++){
        const v=row[j];
        if(v===null||v===undefined) continue;
        const s=String(v).trim();
        if(datePattern.test(s)) dc[j]=s.padStart(2,'0');
      }
      if(Object.keys(dc).length>=5){currentDateMap=dc;continue;}
    }
    
    const shizai=row[2];
    if(shizai===null||shizai===undefined) continue;
    const shizaiStr=String(shizai).trim();
    if(!shizaiPattern.test(shizaiStr)) continue;
    if(!currentDateMap) continue;
    
    const hinmeiRow=data[i-1]||[];
    const hinmeiKt=hinmeiRow[1]!=null?String(hinmeiRow[1]).trim():'';
    const bunbanRow=data[i-2]||[];
    const chubanRow=data[i+1]||[];
    const chuban=chubanRow[1]!=null?String(chubanRow[1]).trim():'';
    
    let seq=0;
    const sortedCols=Object.keys(currentDateMap).map(Number).sort((a,b)=>a-b);
    for(const col of sortedCols){
      const day=currentDateMap[col];
      const qty=row[col];
      if(qty===null||qty===undefined||qty===''||qty===0) continue;
      const qtyNum=parseFloat(qty);
      if(isNaN(qtyNum)||qtyNum<=0) continue;
      
      let bs='';
      if(col<bunbanRow.length){
        const bv=bunbanRow[col];
        if(bv!==null&&bv!==undefined&&String(bv).trim()!==''){
          const bvs=String(bv).trim();
          if(/^\d{1,2}$/.test(bvs)) bs=bvs.padStart(2,'0');
        }
      }
      if(!bs){seq++;bs=String(seq).padStart(2,'0');}
      
      const chakuYMD=`${year}${pad2(month)}${day}`;
      const jban=chuban&&bs?`${chuban}-${bs}`:chuban;
      
      rows.push({shizai:shizaiStr,hinmeiKt,chuban,bunban:bs,chaku:chakuYMD,qty:qtyNum,jban});
    }
  }
  return rows;
}

// ===== 出荷カレンダー(ビュー1) =====
function buildPivot(){
  const pivot={};
  const allDates=new Set();
  
  parsedRows.forEach(r=>{
    const key=r.shizai;
    if(!pivot[key]){
      pivot[key]={shizai:r.shizai, pn:r.pn||'', nm:r.nm||r.hinmeiKt, byDate:{}, total:0};
    }
    const d=r.shukka||r.noki||r.chaku;
    if(!d) return;
    pivot[key].byDate[d]=(pivot[key].byDate[d]||0)+r.qty;
    pivot[key].total+=r.qty;
    allDates.add(d);
  });
  
  const sortedDates=Array.from(allDates).sort();
  const dateList=[];
  if(sortedDates.length>0){
    const minD=ymdToDate(sortedDates[0]);
    const maxD=ymdToDate(sortedDates[sortedDates.length-1]);
    const cur=new Date(minD);
    while(cur<=maxD){
      const wd=cur.getDay();
      if(wd>=1 && wd<=5){
        dateList.push(`${cur.getFullYear()}${pad2(cur.getMonth()+1)}${pad2(cur.getDate())}`);
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  
  const items=Object.values(pivot).sort((a,b)=>{
    if(!!a.pn !== !!b.pn) return a.pn?-1:1;
    if(a.pn!==b.pn) return a.pn<b.pn?-1:1;
    return a.shizai<b.shizai?-1:1;
  });
  
  return {items, dateList};
}

function renderCalendar(){
  const {items, dateList}=buildPivot();
  const tbl=document.getElementById('calTable');
  
  let html='<thead><tr>';
  html+='<th class="sticky-col col-pn" rowspan="2">品番</th>';
  html+='<th class="sticky-col col-sz" rowspan="2">資材コード</th>';
  html+='<th class="sticky-col col-nm" rowspan="2">品名</th>';
  let prevMonth=null;
  dateList.forEach(d=>{
    const dt=ymdToDate(d);
    const mm=dt.getMonth()+1;
    const dd=dt.getDate();
    const wd=dt.getDay();
    const isMonthChg = (prevMonth!==null && mm!==prevMonth);
    let cls='';
    if(isMonthChg) cls='monthchg';
    else if(wd===1) cls='monday';
    html+=`<th class="${cls}">${mm}/${pad2(dd)}</th>`;
    prevMonth=mm;
  });
  html+='<th class="total-h" rowspan="2">合計</th></tr>';
  html+='<tr>';
  dateList.forEach(d=>{
    const dt=ymdToDate(d);
    const wd=dt.getDay();
    const cls=wd===1?'monday':'';
    html+=`<th class="${cls}">${WD[wd]}</th>`;
  });
  html+='</tr></thead>';
  
  html+='<tbody>';
  items.forEach(it=>{
    html+='<tr>';
    const pnDisp=it.pn||'<span style="color:var(--danger)">—</span>';
    html+=`<td class="sticky-col col-pn code">${pnDisp}</td>`;
    html+=`<td class="sticky-col col-sz code">${it.shizai}</td>`;
    html+=`<td class="sticky-col col-nm label">${it.nm||''}</td>`;
    dateList.forEach(d=>{
      const dt=ymdToDate(d);
      const wd=dt.getDay();
      const monCls=wd===1?' mon-col':'';
      const q=it.byDate[d];
      if(q){
        html+=`<td class="qty${monCls}">${q.toLocaleString()}</td>`;
      }else{
        html+=`<td class="zero${monCls}">·</td>`;
      }
    });
    html+=`<td class="total">${it.total.toLocaleString()}</td>`;
    html+='</tr>';
  });
  html+='</tbody>';
  
  html+='<tfoot><tr>';
  html+='<td class="sticky-col col-pn label" colspan="3" style="left:0;">日別合計</td>';
  let grand=0;
  dateList.forEach(d=>{
    let sum=0;
    items.forEach(it=>{sum+=(it.byDate[d]||0);});
    grand+=sum;
    html+=`<td>${sum?sum.toLocaleString():'·'}</td>`;
  });
  html+=`<td>${grand.toLocaleString()}</td>`;
  html+='</tr></tfoot>';
  
  tbl.innerHTML=html;
  
  document.getElementById('sItems').textContent=items.length;
  document.getElementById('sDays').textContent=Array.from(new Set(parsedRows.map(r=>r.shukka||r.noki||r.chaku).filter(Boolean))).length;
  document.getElementById('sRecords').textContent=parsedRows.length;
  document.getElementById('sQty').textContent=parsedRows.reduce((a,r)=>a+r.qty,0).toLocaleString();
  const missPn=items.filter(it=>!it.pn).length;
  document.getElementById('sMissPn').textContent=missPn;
  
  const badge=document.getElementById('calHeaderBadge');
  if(missPn>0){
    badge.innerHTML=`<span class="badge badge-warn">品番未照合 ${missPn}件</span>`;
    document.getElementById('dlExcelMsg').textContent=`品番マスタに未登録の資材コードがあります(出力には資材コードを使用)`;
    document.getElementById('dlExcelMsg').className='msg err';
  }else{
    badge.innerHTML=`<span class="badge badge-ok">完成</span>`;
    document.getElementById('dlExcelMsg').textContent='出力準備OK';
    document.getElementById('dlExcelMsg').className='msg ok';
  }
  document.getElementById('dlExcelBtn').disabled = items.length===0;
}

function downloadExcel(){
  const {items, dateList}=buildPivot();
  
  const wb=XLSX.utils.book_new();
  const aoa=[];
  const hdr1=['品番','資材コード','品名'];
  dateList.forEach(d=>{
    const dt=ymdToDate(d);
    hdr1.push(`${dt.getMonth()+1}/${pad2(dt.getDate())}`);
  });
  hdr1.push('合計');
  aoa.push(hdr1);
  const hdr2=['','',''];
  dateList.forEach(d=>{
    const dt=ymdToDate(d);
    hdr2.push(WD[dt.getDay()]);
  });
  hdr2.push('');
  aoa.push(hdr2);
  items.forEach(it=>{
    const row=[it.pn||'(未照合)', it.shizai, it.nm||''];
    let total=0;
    dateList.forEach(d=>{
      const q=it.byDate[d]||0;
      row.push(q||null);
      total+=q;
    });
    row.push(total);
    aoa.push(row);
  });
  const totalRow=['日別合計','',''];
  let grand=0;
  dateList.forEach(d=>{
    let sum=0;
    items.forEach(it=>{sum+=(it.byDate[d]||0);});
    grand+=sum;
    totalRow.push(sum||null);
  });
  totalRow.push(grand);
  aoa.push(totalRow);
  
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const cols=[{wch:10},{wch:13},{wch:28}];
  dateList.forEach(()=>cols.push({wch:8}));
  cols.push({wch:10});
  ws['!cols']=cols;
  ws['!rows']=[{hpt:20},{hpt:18}];
  ws['!merges']=[];
  ws['!merges'].push({s:{r:0,c:0},e:{r:1,c:0}});
  ws['!merges'].push({s:{r:0,c:1},e:{r:1,c:1}});
  ws['!merges'].push({s:{r:0,c:2},e:{r:1,c:2}});
  ws['!merges'].push({s:{r:0,c:3+dateList.length},e:{r:1,c:3+dateList.length}});
  const totalRowIdx=2+items.length;
  ws['!merges'].push({s:{r:totalRowIdx,c:0},e:{r:totalRowIdx,c:2}});
  ws['!freeze']={xSplit:3,ySplit:2};
  ws['!pageSetup']={orientation:'landscape',fitToWidth:1,fitToHeight:1};
  
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let R=2;R<=range.e.r;R++){
    for(let C=3;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(ws[addr] && typeof ws[addr].v==='number'){
        ws[addr].z='#,##0';
      }
    }
  }
  
  XLSX.utils.book_append_sheet(wb,ws,'出荷カレンダー');
  
  // 出荷明細シート
  const detail=[['出荷予定日','曜日','納期','着日','品番','資材コード','品名','数量','注番']];
  const flat=parsedRows.map(r=>({
    shukka:r.shukka||r.noki||r.chaku,
    noki:r.noki||r.chaku,
    chaku:r.chaku,
    pn:r.pn||'', sz:r.shizai, nm:r.nm||r.hinmeiKt||'',
    qty:r.qty, chuban:r.chuban||''
  }));
  flat.sort((a,b)=>{
    if(a.shukka!==b.shukka) return a.shukka<b.shukka?-1:1;
    return a.pn<b.pn?-1:1;
  });
  flat.forEach(r=>{
    const dt=ymdToDate(r.shukka);
    const wd=dt?WD[dt.getDay()]:'';
    const fmt=ymd=>ymd?`${ymd.substr(0,4)}-${ymd.substr(4,2)}-${ymd.substr(6,2)}`:'';
    detail.push([fmt(r.shukka),wd,fmt(r.noki),fmt(r.chaku),r.pn,r.sz,r.nm,r.qty,r.chuban]);
  });
  const ws2=XLSX.utils.aoa_to_sheet(detail);
  ws2['!cols']=[{wch:12},{wch:5},{wch:12},{wch:12},{wch:10},{wch:13},{wch:28},{wch:9},{wch:12}];
  ws2['!freeze']={xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb,ws2,'出荷明細');
  
  const fname=`出荷カレンダー_${currentYear}年${pad2(currentMonth)}月.xlsx`;
  XLSX.writeFile(wb,fname);
}

function renderOrderTable(){
  const tbody=document.getElementById('ordTbody');
  tbody.innerHTML='';
  const today=todayYMD();
  
  parsedRows.forEach(r=>{
    if(r._origIdx===undefined) r._origIdx=parsedRows.indexOf(r);
  });
  
  const indexed=parsedRows.map((r,i)=>({r,i}));
  indexed.sort((a,b)=>{
    const ga=groupsMap[a.r.shizai]||'';
    const gb=groupsMap[b.r.shizai]||'';
    const na=a.r.noki||'99999999';
    const nb=b.r.noki||'99999999';
    if(na!==nb) return na<nb?-1:1;
    if(ga!==gb){
      if(ga==='') return 1;
      if(gb==='') return -1;
      return ga<gb?-1:1;
    }
    return a.r.shizai<b.r.shizai?-1:1;
  });
  
  let prevNoki='';
  let prevGroupKey='';
  let displayNum=0;
  
  indexed.forEach(({r,i})=>{
    displayNum++;
    const groupName=groupsMap[r.shizai];
    const groupKey=`${r.noki}__${groupName||r.shizai}`;
    
    if(r.noki!==prevNoki){
      const sep=document.createElement('tr');
      sep.className='date-sep';
      const label=r.noki
        ? `▸ 納期 ${r.noki.substr(0,4)}/${r.noki.substr(4,2)}/${r.noki.substr(6,2)}`
        : '▸ 納期 未入力';
      sep.innerHTML=`<td colspan="10">${label}</td>`;
      tbody.appendChild(sep);
      prevNoki=r.noki;
      prevGroupKey='';
    }
    
    if(prevGroupKey && groupKey!==prevGroupKey){
      const gsep=document.createElement('tr');
      gsep.className='group-sep';
      gsep.innerHTML='<td colspan="10"></td>';
      tbody.appendChild(gsep);
    }
    prevGroupKey=groupKey;
    
    const tr=document.createElement('tr');
    if(!r.noki||!r.shukka||!r.pn) tr.classList.add('warn-row');
    
    let badge;
    if(groupName===undefined){
      badge=`<span class="group-badge solo" style="border-color:rgba(255,71,87,0.4);color:var(--danger);">未登録</span>`;
    }else if(groupName===''){
      badge=`<span class="group-badge solo">単独</span>`;
    }else{
      badge=`<span class="group-badge">${groupName}</span>`;
    }
    
    tr.innerHTML=`
      <td>${displayNum}</td>
      <td>${today}</td>
      <td>${r.chaku}</td>
      <td>${badge}</td>
      <td>${r.shizai}</td>
      <td><input type="text" data-idx="${i}" data-field="pn" value="${r.pn}" placeholder="未照合" class="${r.pn?'filled':'unfilled'}"></td>
      <td>${r.qty}</td>
      <td>${r.jban}</td>
      <td><input type="text" data-idx="${i}" data-field="noki" value="${r.noki}" placeholder="未登録" class="${r.noki?'filled':'unfilled'}"></td>
      <td><input type="text" data-idx="${i}" data-field="shukka" value="${r.shukka}" placeholder="未登録" class="${r.shukka?'filled':'unfilled'}"></td>
    `;
    tbody.appendChild(tr);
  });
  
  tbody.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const idx=parseInt(inp.dataset.idx);
      const field=inp.dataset.field;
      let v=inp.value.trim();
      if(field!=='pn'){
        const m=v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
        if(m) v=`${m[1]}${pad2(m[2])}${pad2(m[3])}`;
      }
      parsedRows[idx][field]=v;
      inp.classList.toggle('filled',!!v);
      inp.classList.toggle('unfilled',!v);
      const r=parsedRows[idx];
      const tr=inp.closest('tr');
      if(!r.noki||!r.shukka||!r.pn){tr.classList.add('warn-row');}
      else{tr.classList.remove('warn-row');}
      updateOrderStats();
      // カレンダー側にも反映
      renderCalendar();
    });
  });
  
  updateOrderStats();
}

function updateOrderStats(){
  const total=parsedRows.length;
  const matched=parsedRows.filter(r=>r.pn).length;
  const filled=parsedRows.filter(r=>r.noki&&r.shukka).length;
  const incomplete=parsedRows.filter(r=>!r.pn||!r.noki||!r.shukka).length;
  
  document.getElementById('oTotal').textContent=total;
  document.getElementById('oMatched').textContent=matched;
  document.getElementById('oFilled').textContent=filled;
  document.getElementById('oUnfilled').textContent=incomplete;
  
  const fileKeys=new Set();
  parsedRows.forEach(r=>{
    if(groupsMap[r.shizai]===undefined) return;
    const groupName=groupsMap[r.shizai] || r.shizai;
    fileKeys.add(`${r.noki}__${groupName}`);
  });
  document.getElementById('oFiles').textContent=fileKeys.size;
  
  const dlBtn=document.getElementById('dlBtn');
  const zipBtn=document.getElementById('zipBtn');
  const dlMsg=document.getElementById('dlMsg');
  
  if(incomplete>0){
    dlBtn.disabled=true;
    const parts=[];
    const npn=parsedRows.filter(r=>!r.pn).length;
    const ndt=parsedRows.filter(r=>!r.noki||!r.shukka).length;
    if(npn>0) parts.push(`品番未照合 ${npn}件`);
    if(ndt>0) parts.push(`日付未入力 ${ndt}件`);
    dlMsg.textContent=parts.join(' / ');
    dlMsg.className='msg err';
  }else{
    dlBtn.disabled=false;
    dlMsg.textContent='全件入力済';
    dlMsg.className='msg ok';
  }
  
  if(incomplete>0){
    zipBtn.disabled=true;
  }else{
    const ungrouped=[...new Set(parsedRows.filter(r=>groupsMap[r.shizai]===undefined).map(r=>r.shizai))];
    if(ungrouped.length>0){
      zipBtn.disabled=true;
      dlMsg.textContent=`グループ未登録の資材コード: ${ungrouped.join(', ')}`;
      dlMsg.className='msg err';
    }else{
      zipBtn.disabled=false;
    }
  }
  
  const badge=document.getElementById('ordHeaderBadge');
  if(incomplete>0){
    badge.innerHTML=`<span class="badge badge-warn">未完成 ${incomplete}件</span>`;
  }else if(total>0){
    badge.innerHTML=`<span class="badge badge-ok">完成</span>`;
  }
}

async function downloadGroupedZip(){
  const today=todayYMD();
  const hdr=['処理区分','受注区分','受注番号','受注枝番','受注日','得意先コード','営業担当コード','納入先コード','品番','契約数量','数量','単価','単価区分','納期','出荷予定日','分納区分','ロケーションコード','分類コード1','分類コード2','分類コード3','分類コード4','分類コード5','部署コード','客先発注番号','客先管理番号','備考'];
  
  const buckets={};
  parsedRows.forEach(r=>{
    const groupName=groupsMap[r.shizai] || r.shizai;
    const key=`${r.noki}__${groupName}`;
    if(!buckets[key]) buckets[key]={noki:r.noki, groupName, rows:[]};
    buckets[key].rows.push(r);
  });
  
  const zip=new JSZip();
  const zipBtn=document.getElementById('zipBtn');
  zipBtn.disabled=true;
  const origText=zipBtn.textContent;
  zipBtn.textContent='生成中...';
  
  try{
    for(const key of Object.keys(buckets)){
      const {noki, rows}=buckets[key];
      const jbans=rows.map(r=>r.jban).filter(Boolean);
      const uniqJbans=[...new Set(jbans)].sort();
      const fname=`${noki}_${uniqJbans.join('_')}.csv`;
      
      const lines=[hdr.join(',')];
      rows.forEach(r=>{
        const row=['','','','',today,TOKUISAKI,'',NYUSAKI,r.pn,'',r.qty,'','',r.noki,r.shukka,'','','','','','','','',r.jban,'',''];
        lines.push(row.join(','));
      });
      const csvContent='\uFEFF'+lines.join('\r\n');
      zip.file(fname, csvContent);
    }
    
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`受注データ_グループ別_${today}.zip`;
    a.click();
  }finally{
    zipBtn.textContent=origText;
    zipBtn.disabled=false;
  }
}

// ===== タブ切替 =====
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.view).classList.add('active');
  });
});

// ===== ドラッグ&ドロップ =====
const schZone=document.getElementById('schZone');
schZone.addEventListener('click',e=>{
  if(e.target.id!=='browseBtn') document.getElementById('schFile').click();
});
document.getElementById('browseBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('schFile').click();});
schZone.addEventListener('dragover',e=>{e.preventDefault();schZone.classList.add('dragover');});
schZone.addEventListener('dragleave',()=>schZone.classList.remove('dragover'));
schZone.addEventListener('drop',e=>{
  e.preventDefault();
  schZone.classList.remove('dragover');
  const f=e.dataTransfer.files[0];
  if(!f) return;
  const inp=document.getElementById('schFile');
  const dt=new DataTransfer();
  dt.items.add(f);
  inp.files=dt.files;
  inp.dispatchEvent(new Event('change'));
});

loadPartsMaster();
loadGroupsMaster();
</script>
